<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Pembayaran</title>
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body>
  <header>
    <h1>Halaman Kasir</h1>
    <p>Kelola Pembayaran Pesanan</p>
  </header>

  <div class="container">
    <div id="cashier-orders">Memuat data transaksi...</div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function loadCashierOrders() {
      const res = await RestoAPI.getCashierOrders();
      const container = document.getElementById("cashier-orders");

      if (res.success) {
        if (res.data.length === 0) {
          container.innerHTML = "<p style='text-align:center;'>Tidak ada transaksi aktif.</p>";
          return;
        }

        container.innerHTML = res.data.map(o => `
          <div class="order-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
              <strong>ID: ${o.orderId}</strong>
              <span class="badge badge-${o.status}">${o.status}</span>
            </div>
            <p style="margin: 0 0 0.5rem 0;">Pemesan / Meja: <strong>${o.mejaNama}</strong></p>
            
            <hr style="border:0; border-top: 1px dashed var(--border); margin: 0.75rem 0;">
            
            <!-- Rincian Struk Item -->
            <div style="font-size:0.85rem; margin-bottom: 0.75rem;">
              ${o.items.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;">
                  <span>${i.nama} x ${i.qty}</span>
                  <span>Rp ${Number(i.subtotal).toLocaleString('id-ID')}</span>
                </div>
              `).join('')}
            </div>

            <hr style="border:0; border-top: 1px dashed var(--border); margin: 0.75rem 0;">

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
              <span style="font-weight:bold;">Total Pembayaran:</span>
              <strong style="color:var(--primary); font-size:1.1rem;">Rp ${Number(o.total).toLocaleString('id-ID')}</strong>
            </div>

            ${o.status !== "Selesai" ? `
              <button class="btn btn-success" onclick="processPayment('${o.orderId}', ${o.total})">
                Proses Pembayaran
              </button>
            ` : `<p style="color:green; font-weight:bold; margin:0; text-align:center;">Lunas</p>`}
          </div>
        `).join('');
      }
    }

    async function processPayment(orderId, total) {
      if (!confirm("Konfirmasi proses pembayaran untuk " + orderId + "?")) return;
      
      const paymentDetails = {
        metode: "CASH",
        total: total
      };

      const res = await RestoAPI.processPayment(orderId, paymentDetails);
      if (res.success) {
        alert("Pembayaran Berhasil!");
        loadCashierOrders();
      } else {
        alert("Gagal memproses pembayaran.");
      }
    }

    loadCashierOrders();
  </script>
</body>
</html>
