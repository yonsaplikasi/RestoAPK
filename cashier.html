<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Pembayaran</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header style="background: #28a745;">
    <h1>Kasir Resto</h1>
  </header>

  <div class="container">
    <div id="cashier-orders">Memuat pesanan...</div>
  </div>

  <!-- Area Struk Tersembunyi untuk Cetak -->
  <div id="printable-receipt" style="display:none; padding:10px; font-family:monospace;"></div>

  <script src="js/api.js"></script>
  <script>
    async function loadCashierOrders() {
      const res = await RestoAPI.getCashierOrders();
      const container = document.getElementById("cashier-orders");

      if (res.success) {
        container.innerHTML = res.data.map(o => `
          <div class="order-card">
            <h3>${o.orderId} - ${o.mejaNama}</h3>
            <p>Total: <strong>Rp ${Number(o.total).toLocaleString('id-ID')}</strong></p>
            <p>Status: <span class="badge badge-${o.status}">${o.status}</span></p>
            ${o.status !== "Selesai" ? `
              <button class="btn btn-success" onclick="pay('${o.orderId}', ${o.total})">Bayar / Lunasi</button>
            ` : `
              <button class="btn btn-secondary" onclick="printReceipt('${o.orderId}', '${o.mejaNama}', ${o.total})">Cetak Struk</button>
            `}
          </div>
        `).join('');
      }
    }

    async function pay(orderId, total) {
      if (confirm(`Konfirmasi pembayaran Rp ${total.toLocaleString('id-ID')} untuk ${orderId}?`)) {
        await RestoAPI.processPayment(orderId, { metode: "Tunai", total: total });
        loadCashierOrders();
      }
    }

    function printReceipt(orderId, mejaNama, total) {
      const receipt = document.getElementById("printable-receipt");
      receipt.style.display = "block";
      receipt.innerHTML = `
        <h3 style="text-align:center;">RESTO QR ORDER</h3>
        <p>Order ID: ${orderId}<br>Pemesan: ${mejaNama}<br>Tanggal: ${new Date().toLocaleString('id-ID')}</p>
        <hr>
        <p>TOTAL: Rp ${total.toLocaleString('id-ID')}</p>
        <p style="text-align:center;">-- Terima Kasih --</p>
      `;
      window.print();
      receipt.style.display = "none";
    }

    loadCashierOrders();
  </script>
</body>
</html>
