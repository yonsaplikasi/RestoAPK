<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Pesanan</title>
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body>
  <header>
    <h1>Keranjang Pesanan</h1>
  </header>

  <div class="container">
    <div id="cart-items"></div>

    <div id="checkout-action-area" style="margin-top: 1.5rem;">
      <a href="menu.html" style="display: block; text-align: center; color: var(--primary); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem;">
        + Tambah Menu Lainnya
      </a>

      <div class="form-group">
        <label for="cust-name">Nama Pemesan <span style="color:red">*</span></label>
        <input type="text" id="cust-name" placeholder="Contoh: Budi" required>
      </div>

      <div class="form-group" id="table-select-group" style="display: none;">
        <label for="cust-table">Pilih Nomor Meja / Tipe <span style="color:red">*</span></label>
        <select id="cust-table">
          <option value="">-- Pilih --</option>
          <option value="Meja 1">Meja 1</option>
          <option value="Meja 2">Meja 2</option>
          <option value="Meja 3">Meja 3</option>
          <option value="Takeaway">Takeaway / Bungkus</option>
        </select>
      </div>

      <!-- Pilihan Metode Pembayaran -->
      <div class="form-group">
        <label for="payment-method">Metode Pembayaran <span style="color:red">*</span></label>
        <select id="payment-method" onchange="togglePaymentInfo()">
          <option value="CASH">Bayar di Kasir (Tunai)</option>
          <option value="QRIS">QRIS (Gopay/OVO/Dana/BCA/dll)</option>
          <option value="TRANSFER">Transfer Bank</option>
        </select>
      </div>

      <!-- Box Informasi Non-Tunai (Dinamis) -->
      <div id="qris-info" style="display: none; background: #FFF; border: 1px solid var(--border); padding: 1rem; border-radius: var(--radius); text-align: center; margin-bottom: 1rem;">
        <p style="margin: 0 0 0.5rem 0; font-weight: bold; font-size: 0.9rem;">Scan QRIS di bawah ini:</p>
        <img src="https://via.placeholder.com/200x200?text=QRIS+RESTO" alt="QRIS Resto" style="max-width: 180px; border-radius: 8px; border: 1px solid #ddd;">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">Silakan tunjukkan bukti bayar ke kasir saat mengambil/menerima pesanan.</p>
      </div>

      <div id="transfer-info" style="display: none; background: #FFF; border: 1px solid var(--border); padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem;">
        <p style="margin: 0 0 0.5rem 0; font-weight: bold; font-size: 0.9rem;">Transfer Rekening Bank:</p>
        <p style="margin: 0.2rem 0; font-size: 0.85rem;"><strong>BCA:</strong> 123-456-7890</p>
        <p style="margin: 0.2rem 0; font-size: 0.85rem;"><strong>Mandiri:</strong> 098-765-4321</p>
        <p style="margin: 0.2rem 0; font-size: 0.85rem;"><strong>A.N:</strong> Resto Kamu</p>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem 0;">
        <h3 style="margin: 0; font-size: 1.1rem;">Total Pembayaran:</h3>
        <h3 style="margin: 0; color: var(--primary); font-size: 1.25rem;">Rp <span id="checkout-total">0</span></h3>
      </div>

      <button class="btn" onclick="processCheckout()" style="margin-bottom: 0.75rem;">Checkout Pesanan</button>
      
      <button class="btn" onclick="cancelAllOrders()" style="background: transparent; color: #EF4444; border: 1px solid #FCA5A5; box-shadow: none;">
        Batal Semua Pesanan
      </button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function togglePaymentInfo() {
      const method = document.getElementById("payment-method").value;
      document.getElementById("qris-info").style.display = method === "QRIS" ? "block" : "none";
      document.getElementById("transfer-info").style.display = method === "TRANSFER" ? "block" : "none";
    }
  </script>
</body>
</html>
