<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pesanan</title>
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body>
  <header>
    <h1>Status Pesanan</h1>
  </header>

  <div class="container">
    <div class="order-card" id="status-card">
      <p>Memuat status...</p>
    </div>

    <!-- Area Tombol Aksi Tambahan -->
    <div id="action-buttons" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
      <button id="btn-add-more" class="btn" onclick="addMoreOrder()" style="display: none;">
        + Tambah Pesanan Lain
      </button>
      <!-- Tombol "Ke Menu Utama" telah dihapus dari sini -->
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    async function loadStatus() {
      if (!orderId) return;
      const res = await RestoAPI.getOrderStatus(orderId);
      if (res.success) {
        const d = res.data;
        
        // Tampilkan Tombol Tambah Pesanan
        document.getElementById("btn-add-more").style.display = "block";

        document.getElementById("status-card").innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <h2 style="margin: 0; font-size: 1.1rem;">ID: ${d.orderId}</h2>
            <span class="badge badge-${d.status}">${d.status}</span>
          </div>
          <p style="margin: 0 0 1rem 0;">Pemesan: <strong>${d.mejaNama}</strong></p>
          
          <hr style="border:0; border-top: 1px dashed var(--border); margin: 0.75rem 0;">
          
          <h4 style="margin: 0.5rem 0;">Detail Pesanan:</h4>
          <ul style="padding-left: 1.2rem; margin-bottom: 1rem;">
            ${d.items.map(i => `<li>${i.nama} x ${i.qty} = <strong>Rp ${i.subtotal.toLocaleString('id-ID')}</strong></li>`).join('')}
          </ul>

          <hr style="border:0; border-top: 1px dashed var(--border); margin: 0.75rem 0;">
          
          <div style="display:flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold;">Total:</span>
            <h3 style="margin:0; color: var(--primary);">Rp ${d.total.toLocaleString('id-ID')}</h3>
          </div>
        `;
      }
    }

    // Fungsi mengarahkan kembali ke menu dengan meja yang tersimpan
    function addMoreOrder() {
      const mode = localStorage.getItem("resto_mode");
      const savedMeja = localStorage.getItem("resto_meja");

      // Jika menggunakan Mode Fixed Table (Meja terdeteksi dari QR)
      if (mode === "FIXED_TABLE" && savedMeja) {
        // Ambil hanya angka meja jika tersimpan "Meja 1"
        const mejaNum = savedMeja.replace(/[^0-9]/g, ''); 
        window.location.href = `menu.html?meja=${mejaNum}`;
      } else {
        window.location.href = "menu.html";
      }
    }

    loadStatus();
    setInterval(loadStatus, 5000); // Auto Refresh tiap 5 detik
  </script>
</body>
</html>
